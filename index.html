<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Untukmu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0914;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* EFEK CAHAYA BACKGROUND */
        .glow-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 75, 145, 0.3) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* KARTU UTAMA */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 182, 193, 0.25);
            border-radius: 30px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(255, 75, 145, 0.25);
        }

        .icon-heart {
            font-size: 4rem;
            animation: pulse 1.3s infinite;
            margin-bottom: 20px;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* TOMBOL UNTUK DIKLIK */
        .btn-love {
            background: linear-gradient(135deg, #ff4b91, #ff758c);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 75, 145, 0.5);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-love:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(255, 75, 145, 0.8);
        }

        .btn-love:active {
            transform: scale(0.95);
        }

        /* PESAN YANG MUNCUL SETELAH DIKLIK */
        .pesan-rahasia {
            display: none;
            margin-top: 25px;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .highlight-wina {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.7);
            line-height: 1.4;
        }

        /* ANIMASI BUNGA DAN LOVE MELAYANG */
        .floating-item {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 99;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="card">
        <div class="icon-heart">💖</div>

        <button class="btn-love" id="loveBtn" onclick="tampilkanPesan()">Klik kalau sayang Wina ✨</button>

        <div class="pesan-rahasia" id="pesanBox">
            <div class="highlight-wina">Wina sayang kamuuu! 🤍🌸</div>
        </div>
    </div>

    <script>
        function tampilkanPesan() {
            document.getElementById('loveBtn').style.display = 'none';
            document.getElementById('pesanBox').style.display = 'block';

            const simbol = ['💖', '💕', '❤️', '🌸', '🌹', '🌺', '🌷', '✨', '🥰', '💗', '🤍'];
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    buatBungaLove(simbol);
                }, i * 60);
            }

            setInterval(() => {
                buatBungaLove(simbol);
            }, 300);
        }

        function buatBungaLove(simbol) {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.innerHTML = simbol[Math.floor(Math.random() * simbol.length)];
            
            item.style.left = Math.random() * 100 + 'vw';
            item.style.top = '100vh';
            item.style.fontSize = (Math.random() * 25 + 20) + 'px';
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 4000);
        }
    </script>
</body>
</html>
